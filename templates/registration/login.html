{% extends "base.html" %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center py-5" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-3">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Welcome Back</h2>
                            <p class="text-muted">Sign in to your account</p>
                        </div>
                        
                        <form method="post" id="loginForm" class="needs-validation" novalidate>
                            {% csrf_token %}
                            {% if form.errors %}
                                <div class="alert alert-danger">
                                    Invalid username or password.
                                </div>
                            {% endif %}
                            
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="username" name="username" required placeholder="Username">
                                <label for="username">Username</label>
                                <div class="invalid-feedback">Please enter your username.</div>
                            </div>

                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Password">
                                <label for="password">Password</label>
                                <div class="invalid-feedback">Please enter your password.</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3 mb-4">
                                <span class="spinner-border spinner-border-sm d-none me-2" role="status"></span>
                                Sign In
                            </button>

                            <div class="text-center">
                                <p class="text-muted">Don't have an account? 
                                    <a href="{% url 'user_signup' %}" class="text-decoration-none">Sign up</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.form-floating > .form-control:focus ~ label,
.form-floating > .form-control:not(:placeholder-shown) ~ label {
    color: #0d6efd;
    opacity: .65;
}

.form-control:focus {
    border-color: #86b7fe;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
}

.btn-primary {
    background: linear-gradient(45deg, #0d6efd, #0a58ca);
    border: none;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('loginForm');
    const submitBtn = form.querySelector('button[type="submit"]');
    const spinner = submitBtn.querySelector('.spinner-border');

    form.addEventListener('submit', function(event) {
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        } else {
            spinner.classList.remove('d-none');
            submitBtn.disabled = true;
        }
        form.classList.add('was-validated');
    });
});
</script>
{% endblock %}
