<!-- templates/recipe_search.html -->
{% extends 'base.html' %}
{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search for a Recipe - Faimily</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .recipe-card {
            border: none;
            border-radius: 15px;
            box-shadow:  ​0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .recipe-image {
            border-radius: 15px 15px 0 0;
            height: 200px;
            object-fit: cover;
        }

        .recipe-details {
            padding: 20px;
        }

        .recipe-details h5 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .recipe-details  {
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 25px;
        }

        .recipe-meta {
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: 10px;
        }

        .recipe-actions {
            margin-top: 20px;
        }

        .recipe-actions .btn {
            margin-right: 10px;
            border-radius: 15px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.9rem;
        }
        .rating-display .stars {
            display: inline-flex;
            gap: 0.2rem;
        }
        
        .rating-display .bi-star-fill {
            color: #ffc107;
        }
        
        .rating-display .bi-star {
            color: #dee2e6;
        }
        .missed-ingredients {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        .missed-ingredients h6 {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .missed-ingredients ul {
            list-style-type: none;
            padding-left: 0;
        }
        
        .missed-ingredients ul li {
            margin-bottom: 5px;
        }
    </style>
</head>
<div class="container my-5">
    <h1 class="text-center mb-4">Search for a Recipe</h1>

    <!-- Search Form -->
    <div class="mb-4">
        <form id="recipe-search-form" class="d-flex gap-2">
            <input type="text" id="ingredients" class="form-control" placeholder="Enter ingredients (e.g., farine, flour, sugar)" required>
            <button type="submit" class="btn btn-primary">Find Recipes</button>
        </form>
    </div>

    <!-- Recipe Results -->
    <div class="row" id="recipe-results">
        <!-- Results will be dynamically inserted here -->
    </div>
</div>

<script>
    document.getElementById('recipe-search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const ingredients = document.getElementById('ingredients').value;
        
        fetch(`/find-recipes/?ingredients=${encodeURIComponent(ingredients)}`)
            .then(response => response.json())
            .then(data => {
                const resultsDiv = document.getElementById('recipe-results');
                resultsDiv.innerHTML = '';  // Clear previous results
                
                if (data.error) {
                    resultsDiv.innerHTML = `<p>Error: ${data.error}</p>`;
                    return;
                }
                
                if (data.recipes.length === 0) {
                    resultsDiv.innerHTML = '<p>No recipes found.</p>';
                    return;
                }
                
                // Display recipes
                data.recipes.forEach(recipe => {
                    const recipeDiv = document.createElement('div');
                    recipeDiv.className = 'col-md-4 mb-4';
                    recipeDiv.innerHTML = `
                        <div class="card h-100 recipe-card">
                            <img src="${recipe.image}" class="recipe-image" alt="${recipe.title}">
                            <div class="recipe-details">
                                <span class="badge bg-primary category-badge">${recipe.category || 'Uncategorized'}</span>
                                <h5 class="card-title">${recipe.title}</h5>
                                <p class="card-text">${recipe.description || 'No description available.'}</p>
                                
                                <!-- Afficher les ingrédients manquants -->
                                <div class="missed-ingredients">
                                    <h6>Missing Ingredients:</h6>
                                    <ul>
                                     <img src="${ingredient.image}" class="recipe-image" alt="${ingredient.name}">
                                        ${recipe.missedIngredients.map(ingredient => `
                                            <li>${ingredient.original}</li>
                                        `).join('')}
                                    </ul>
                                </div>
    
                                <div class="recipe-meta">
                                    <small class="text-muted">
                                        <i class="bi bi-clock"></i> ${recipe.prep_time || 'pas de prep_times'} min prep | ${recipe.cook_time || 'N/A'} min cook
                                    </small>
                                </div>
                                <div class="recipe-actions">
                                    <a href="/recipe/${recipe.id}/" class="btn btn-primary">View</a>
                                </div>
                            </div>
                        </div>
                    `;
                    resultsDiv.appendChild(recipeDiv);
                });
            })
            .catch(error => {
                console.error('Error:', error);
            });
    });


</script>
{% endblock %}
